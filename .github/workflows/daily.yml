name: Extend Daily Drop

on:
  schedule:
    # Monday morning, New York. Append days only when fewer than 60 remain.
    - cron: "30 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-drop
  cancel-in-progress: false

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extend the schedule
        run: python3 scripts/build_daily.py --extend

      - name: Commit new days
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "No new days."
          else
            git commit -m "Extend the Daily Drop schedule"
            git push origin HEAD:main
          fi
