name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the deploy jobs in daily.yml and scrydex.yml.
# Queued deploys wait. They are not cancelled, so a price publish is not
# dropped when a push starts a second deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This run may have waited behind a data deploy. The triggering
          # SHA can be older than main by then, and deploying it would roll
          # the new prices back. A manual run still deploys the ref that
          # was selected.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./.github/actions/deploy-pages
