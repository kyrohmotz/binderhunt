name: Sync Scrydex cache

on:
  schedule:
    # Once a day. Scrydex asks that prices be cached at least 24 hours.
    # The script spreads the credits left in the month across the days left.
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrydex-cache
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, same as the Daily Drop job. A shallow clone can
          # fail to rebase when that job pushes main during this sync.
          fetch-depth: 0

      - name: Require Scrydex secrets
        env:
          SCRYDEX_API_KEY: ${{ secrets.SCRYDEX_API_KEY }}
          SCRYDEX_TEAM_ID: ${{ secrets.SCRYDEX_TEAM_ID }}
        run: |
          missing=0
          if [ -z "$SCRYDEX_API_KEY" ]; then
            echo "::error title=Missing SCRYDEX_API_KEY::Add repository secret SCRYDEX_API_KEY (Settings → Secrets and variables → Actions → New repository secret). Use the API key from the Scrydex dashboard. The value is not printed."
            missing=1
          fi
          if [ -z "$SCRYDEX_TEAM_ID" ]; then
            echo "::error title=Missing SCRYDEX_TEAM_ID::Add repository secret SCRYDEX_TEAM_ID. Scrydex requires the X-Team-ID header. Copy the team id from the Scrydex account hub. The value is not printed."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Refresh euro rate
        run: python3 scripts/fetch_fx.py

      - name: Refresh cached cards
        env:
          SCRYDEX_API_KEY: ${{ secrets.SCRYDEX_API_KEY }}
          SCRYDEX_TEAM_ID: ${{ secrets.SCRYDEX_TEAM_ID }}
          SCRYDEX_MONTHLY_CAP: ${{ vars.SCRYDEX_MONTHLY_CAP || '15000' }}
          SCRYDEX_STORE_RESERVE: ${{ vars.SCRYDEX_STORE_RESERVE || '15000' }}
          SCRYDEX_RUN_CAP: ${{ vars.SCRYDEX_RUN_CAP || '500' }}
          SCRYDEX_RUN_CARD_CAP: ${{ vars.SCRYDEX_RUN_CARD_CAP || '100' }}
        run: python3 scripts/sync_scrydex.py

      # A 402 or three card 5xx responses exit nonzero only after scrydex.json
      # and the credit ledger are written. always() still commits those files
      # when they changed. The failed refresh step keeps the job red.
      # !cancelled() skips the push when the run was cancelled mid-request.
      # Pages deploy below still requires a green refresh, so this red run
      # saves the files and the next successful run publishes them.
      - name: Commit cache
        id: commit
        if: "${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scrydex.json data/scrydex-usage.json data/fx.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update cached Scrydex prices"
          # The Daily Drop quote also pushes main around 09:00 UTC, just after
          # this 08:15 UTC sync. If that quote lands first, the push is rejected.
          # Fetch, rebase onto the new main, and retry, the same way the Daily
          # Drop extend job does. Credit caps above are untouched.
          base=$(git rev-parse HEAD)
          ok=0
          for delay in 0 4 8 16 32; do
            if [ "$delay" -ne 0 ]; then
              echo "pull --rebase and push retry in ${delay}s"
              sleep "$delay"
              git reset --hard "$base"
            fi
            git fetch origin main
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              continue
            fi
            if git push origin HEAD:main; then
              ok=1
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "push failed after retries"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
