name: Sync Scrydex cache

on:
  schedule:
    # Once a day. Scrydex asks that prices be cached at least 24 hours.
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrydex-cache
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Scrydex secrets
        env:
          SCRYDEX_API_KEY: ${{ secrets.SCRYDEX_API_KEY }}
          SCRYDEX_TEAM_ID: ${{ secrets.SCRYDEX_TEAM_ID }}
        run: |
          missing=0
          if [ -z "$SCRYDEX_API_KEY" ]; then
            echo "::error title=Missing SCRYDEX_API_KEY::Add repository secret SCRYDEX_API_KEY (Settings → Secrets and variables → Actions → New repository secret). Use the API key from the Scrydex dashboard. The value is not printed."
            missing=1
          fi
          if [ -z "$SCRYDEX_TEAM_ID" ]; then
            echo "::error title=Missing SCRYDEX_TEAM_ID::Add repository secret SCRYDEX_TEAM_ID. Scrydex requires the X-Team-ID header. Copy the team id from the Scrydex account hub. The value is not printed."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Refresh euro rate
        run: python3 scripts/fetch_fx.py

      - name: Refresh cached cards
        env:
          SCRYDEX_API_KEY: ${{ secrets.SCRYDEX_API_KEY }}
          SCRYDEX_TEAM_ID: ${{ secrets.SCRYDEX_TEAM_ID }}
          SCRYDEX_MONTHLY_CAP: ${{ vars.SCRYDEX_MONTHLY_CAP || '15000' }}
          SCRYDEX_STORE_RESERVE: ${{ vars.SCRYDEX_STORE_RESERVE || '15000' }}
          SCRYDEX_RUN_CAP: ${{ vars.SCRYDEX_RUN_CAP || '500' }}
          SCRYDEX_RUN_CARD_CAP: ${{ vars.SCRYDEX_RUN_CARD_CAP || '100' }}
        run: python3 scripts/sync_scrydex.py

      - name: Commit cache
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scrydex.json data/scrydex-usage.json data/fx.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update cached Scrydex prices"
          # The Daily Drop quote also pushes main at 09:00 UTC, just after this
          # 08:15 UTC sync. If that quote lands first, the push below is rejected
          # as a non-fast-forward. Replay this commit onto the new main and
          # retry. Any other push failure stops the job.
          base=$(git rev-parse HEAD)
          ok=0
          for delay in 0 4 8 16 32; do
            if [ "$delay" -ne 0 ]; then
              echo "rebase and push retry in ${delay}s"
              sleep "$delay"
              git reset --hard "$base"
            fi
            git fetch --deepen=32 origin main || git fetch origin main
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              continue
            fi
            push_log=$(mktemp)
            if git push origin HEAD:main >"$push_log" 2>&1; then
              cat "$push_log"
              ok=1
              break
            fi
            cat "$push_log"
            if ! grep -Eqi 'non-fast-forward|Updates were rejected' "$push_log"; then
              echo "push failed for a reason other than a non-fast-forward rejection"
              exit 1
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "push failed after non-fast-forward retries"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
